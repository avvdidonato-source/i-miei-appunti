<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Appunti vocali semplici e accessibili">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>I miei appunti</title>
  <style>
    :root { --bg:#000; --panel:#171717; --fg:#fff; --accent:#ffe500; --border:#ffe500; --muted:#d5d5d5; --font:1.25rem; }
    * { box-sizing:border-box; }
    html { background:var(--bg); color-scheme:dark; }
    body { margin:0; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); background:var(--bg); color:var(--fg); font-family:Arial,Helvetica,sans-serif; font-size:var(--font); line-height:1.45; }
    button, textarea, input { font:inherit; }
    button { min-height:64px; border:3px solid var(--accent); border-radius:18px; padding:14px 18px; background:#000; color:#fff; font-weight:800; cursor:pointer; touch-action:manipulation; }
    button:focus-visible, textarea:focus-visible, input:focus-visible { outline:5px solid #fff; outline-offset:4px; }
    button.primary { background:var(--accent); color:#000; }
    button.light { background:#fff; color:#000; border-color:#fff; }
    button.danger { border-color:#fff; color:#fff; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .app { width:min(100%,760px); margin:0 auto; min-height:100vh; padding:18px 16px 28px; display:flex; flex-direction:column; gap:18px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:2px solid #555; padding:6px 0 16px; }
    h1 { color:var(--accent); font-size:clamp(2rem,7vw,3rem); line-height:1.05; margin:0; }
    h2 { font-size:1.5rem; margin:0; }
    .subtitle { color:var(--muted); margin:6px 0 0; font-size:1rem; }
    .toolbar { display:flex; gap:10px; align-items:center; }
    .small { min-height:48px; padding:8px 13px; border-radius:14px; font-size:1rem; }
    .stack { display:grid; gap:12px; }
    .note { background:var(--panel); border:2px solid #aaa; border-radius:20px; padding:16px; display:grid; gap:14px; }
    .date { color:var(--accent); font-size:1rem; font-weight:800; }
    .note-text { white-space:pre-wrap; overflow-wrap:anywhere; font-size:1.22em; }
    .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .actions button { min-height:70px; padding:8px 4px; font-size:.92em; }
    .empty { border:2px dashed #888; border-radius:18px; padding:24px 18px; color:var(--muted); text-align:center; }
    .editor { display:grid; gap:14px; }
    label { display:block; font-weight:800; margin-bottom:8px; }
    textarea { width:100%; min-height:210px; resize:vertical; border:3px solid var(--accent); border-radius:18px; padding:16px; color:#fff; background:#191919; font-size:1.2em; line-height:1.5; }
    .wide { width:100%; }
    .status { min-height:1.5em; color:var(--accent); font-weight:700; }
    .help { color:var(--muted); font-size:.92rem; }
    .footer { margin-top:auto; border-top:1px solid #555; padding-top:14px; color:var(--muted); font-size:.85rem; }
    .hidden { display:none !important; }
    .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .controls button { flex:1; }
    @media (min-width:600px) { .app { padding:28px 24px; } .actions button { font-size:1rem; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; transition:none !important; } }
  </style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>I miei appunti</h1>
      <p class="subtitle" id="count">I tuoi promemoria, sempre a portata di mano</p>
    </div>
    <div class="toolbar">
      <button class="small" id="smaller" aria-label="Riduci caratteri">A−</button>
      <button class="small" id="larger" aria-label="Ingrandisci caratteri">A+</button>
    </div>
  </header>

  <section id="home" class="stack" aria-label="Elenco appunti">
    <button class="wide" id="readAll">🔊　LEGGI TUTTI</button>
    <div id="notes" class="stack" aria-live="polite"></div>
    <button class="primary wide" id="newNote">＋　NUOVO APPUNTO</button>
  </section>

  <section id="edit" class="editor hidden" aria-label="Modifica appunto">
    <div class="controls">
      <button class="small" id="back">←　INDIETRO</button>
      <h2 id="editorTitle">Nuovo appunto</h2>
    </div>
    <button class="primary wide" id="dictate">🎙　DETTА</button>
    <p class="help" id="dictationHelp">Premi e parla. Se la dettatura non è disponibile, puoi usare il microfono della tastiera.</p>
    <div>
      <label for="noteText">Testo dell'appunto</label>
      <textarea id="noteText" placeholder="Scrivi o detta qui il tuo appunto..." autocomplete="off"></textarea>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <button class="wide" id="preview">🔊　ASCOLTA L'APPUNTO</button>
    <button class="primary wide" id="save">✓　SALVA</button>
    <button class="danger wide" id="cancel">ANNULLA</button>
  </section>

  <footer class="footer">
    Gli appunti sono salvati su questo dispositivo. Non vengono inviati online.
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
